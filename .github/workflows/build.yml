# Checks that the project builds. Runs on pull requests into main, on pushes to main and
# to the version branches (code-v...), and can be started by hand from the Actions tab.
name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'code-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 23 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '23'
          cache: maven

      - name: Compile and run the tests
        run: mvn -B clean verify
